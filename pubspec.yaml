name: vamoose
description: "Slide every block off the board before the clock runs out."
publish_to: 'none'
version: 1.3.0+12

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  audioplayers: ^6.8.1
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.5
  google_mobile_ads: ^9.2.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  clock: ^1.1.2
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/levels/
    - assets/sounds/
    - assets/music/
  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lexend-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lexend-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lexend-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#1B2340"
  adaptive_icon_foreground: assets/icon/foreground.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#EEF1F8"
  image: assets/icon/splash.png
  android_12:
    color: "#EEF1F8"
    image: assets/icon/splash_android12.png
    icon_background_color: "#EEF1F8"
  ios: false
  web: false
